<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Masuk ke akun Dhan store Anda untuk mulai top-up game favorit.">
  <title>Masuk — Dhan store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div id="toast-container" class="toast-container"></div>
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/images/logos.jpeg" alt="Logo Dhan store">
      <span class="auth-logo-name">Dhan store</span>
    </div>
    <h1 class="auth-title">Selamat Datang!</h1>
    <p class="auth-subtitle">Masuk ke akun kamu untuk mulai top-up</p>
    <div id="alert-box" style="display:none"></div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="identifier">Username / Email</label>
        <input type="text" id="identifier" name="identifier" class="form-input" placeholder="Masukkan username atau email" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="Masukkan password" required autocomplete="current-password">
      </div>
      <button type="submit" id="btn-login" class="btn btn-primary btn-full" style="margin-top:8px;">Masuk</button>
    </form>
    <div class="auth-footer">Belum punya akun? <a href="register.html">Daftar sekarang</a></div>
  </div>
  <script src="js/script.js"></script>
  <script>
    redirectIfLoggedIn();
    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Memproses...';
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      setTimeout(() => {
        const result = Auth.login({ identifier, password });
        const alertBox = document.getElementById('alert-box');
        if (result.ok) {
          alertBox.style.display = 'block';
          alertBox.className = 'alert alert-success';
          alertBox.innerHTML = '✓ ' + result.message;
          setTimeout(() => {
            const params = new URLSearchParams(window.location.search);
            window.location.href = params.get('redirect') || 'index.html';
          }, 800);
        } else {
          alertBox.style.display = 'block';
          alertBox.className = 'alert alert-error';
          alertBox.innerHTML = '✕ ' + result.message;
          btn.disabled = false;
          btn.innerHTML = 'Masuk';
        }
      }, 600);
    }
  </script>
</body>
</html>
